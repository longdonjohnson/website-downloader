name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3 # This action can download the correct Gradle version if gradlew.jar is missing or to ensure the correct version

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
      working-directory: ./android

    - name: Build with Gradle
      run: ./gradlew assembleDebug
      working-directory: ./android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
